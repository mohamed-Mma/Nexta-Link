<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexta Link — رفع الصور</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-black text-white min-h-screen">
  <header class="border-b border-gray-800 px-6 py-4 flex items-center justify-between sticky top-0 bg-black/80 backdrop-blur z-10">
    <div class="flex items-center gap-3">
      <img src="logo.jpg" alt="Nexta" class="h-9 w-auto">
      <span class="text-xl font-bold tracking-wider text-neon">NEXTA LINK</span>
    </div>
    <button id="langToggle" class="text-sm border border-neon/40 px-3 py-1.5 rounded-full hover:bg-neon/10 transition">
      English
    </button>
  </header>

  <main id="app" class="max-w-3xl mx-auto px-4 py-10"></main>

  <footer class="text-center text-gray-500 text-sm py-8 border-t border-gray-800">
    © 2026 Nexta — Modern Technology
  </footer>

  <script src="app.js"></script>
</body>
</html>
